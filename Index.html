html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2-D2 Interface v0.6</title>
    <style>
        :root {
            --r2-blue: #0066cb;
            --r2-silver: #cccccc;
            --r2-dark-silver: #999999;
            --r2-white: #eeeeee;
            --r2-red: #ff0000;
            --r2-dark: #111111;
            --glow-blue: #00aaff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--r2-dark);
            color: var(--r2-white);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #interface-container {
            width: 1024px;
            height: 768px;
            background: radial-gradient(circle, #1a1a24 0%, #0a0a0f 100%);
            border: 4px solid var(--r2-dark-silver);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 102, 203, 0.3);
            display: grid;
            grid-template-rows: 80px 1fr 60px;
            grid-template-columns: 280px 1fr;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
        }

        /* --- Header --- */
        header {
            grid-area: header;
            background: linear-gradient(90deg, var(--r2-blue) 0%, #003366 100%);
            border-bottom: 3px solid var(--r2-silver);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
        }

        .logic-display {
            display: flex;
            gap: 15px;
        }

        .logic-led {
            width: 40px;
            height: 20px;
            background-color: #333;
            border: 2px solid var(--r2-silver);
            border-radius: 3px;
            animation: logicBlink 0.8s infinite alternate;
        }

        .logic-led.blue { animation-delay: 0s; background-color: var(--r2-blue); box-shadow: 0 0 10px var(--glow-blue); }
        .logic-led.red { animation-delay: 0.4s; background-color: var(--r2-red); box-shadow: 0 0 10px var(--r2-red); }

        h1 {
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--r2-white);
            text-shadow: 0 0 8px var(--glow-blue);
        }

        /* --- Sidebar --- */
        sidebar {
            grid-area: sidebar;
            background-color: rgba(255, 255, 255, 0.03);
            border-right: 2px solid rgba(0, 102, 203, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .system-status-panel {
            border: 1px solid var(--r2-blue);
            background: rgba(0, 102, 203, 0.1);
            padding: 15px;
            border-radius: 6px;
        }

        .status-item {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .status-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #222;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .status-bar-fill {
            height: 100%;
            background-color: var(--r2-blue);
            width: 85%;
            box-shadow: 0 0 8px var(--glow-blue);
        }

        /* --- Main Content Area --- */
        main {
            grid-area: main;
            padding: 20px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .display-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            border: 2px solid var(--r2-silver);
            background-color: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        .panel-title {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--r2-blue);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 102, 203, 0.4);
            padding-bottom: 5px;
        }

        /* Holo Projector Screen Mock */
        .holo-screen {
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .holo-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 102, 203, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 102, 203, 0.1) 1px, transparent 1px);
            background-size: 10px 10px;
        }

        .psi-emitter {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #111;
            border: 4px solid var(--r2-silver);
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .psi-lens {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background-color: #222;
            animation: psiGlow 3s infinite alternate;
        }

        /* Acoustic Signaler Console Log */
        .console-log {
            font-size: 12px;
            color: #00ff00;
            height: 85%;
            overflow-y: auto;
            white-space: pre-line;
            padding-right: 5px;
        }

        /* Diagnostics Circle */
        .radar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85%;
        }

        .radar-circle {
            width: 150px;
            height: 150px;
            border: 2px solid var(--r2-blue);
            border-radius: 50%;
            position: relative;
            animation: radarSpin 4s linear infinite;
        }

        .radar-sweep {
            position: absolute;
            width: 50%;
            height: 50%;
            background: linear-gradient(45deg, rgba(0,170,255,0.4) 0%, transparent 100%);
            transform-origin: bottom right;
            top: 0;
            left: 0;
        }

        /* --- Footer --- */
        footer {
            grid-area: footer;
            background-color: #050508;
            border-top: 2px solid rgba(0, 102, 203, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            color: var(--r2-dark-silver);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--r2-blue);
            color: white;
            border: 1px solid var(--r2-silver);
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #0052a3;
            box-shadow: 0 0 8px var(--glow-blue);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* --- Animations --- */
        @keyframes logicBlink {
            0% { opacity: 0.3; filter: brightness(0.5); }
            100% { opacity: 1; filter: brightness(1.3); }
        }

        @keyframes psiGlow {
            0% { background-color: #330000; box-shadow: 0 0 5px #ff0000; }
            50% { background-color: #002244; box-shadow: 0 0 15px #00aaff; }
            100% { background-color: #330033; box-shadow: 0 0 10px #aa00ff; }
        }

        @keyframes radarSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Custom Scrollbar for console log */
        .console-log::-webkit-scrollbar { width: 4px; }
        .console-log::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .console-log::-webkit-scrollbar-thumb { background: var(--r2-blue); border-radius: 2px; }
    </style>
</head>
<body>

    <div id="interface-container">
        <header>
            <div class="logic-display">
                <div class="logic-led blue"></div>
                <div class="logic-led red"></div>
            </div>
            <h1>R2-D2 ASTROMECH INTERFACE v0.6</h1>
            <div class="logic-display">
                <div class="logic-led red"></div>
                <div class="logic-led blue"></div>
            </div>
        </header>

        <sidebar>
            <div class="system-status-panel">
                <div class="status-item">
                    <label>DRIVE POWER</label>
                    <div class="status-bar-bg"><div class="status-bar-fill" style="width: 92%;"></div></div>
                </div>
                <div class="status-item">
                    <label>LOGIC PROCESSOR</label>
                    <div class="status-bar-bg"><div class="status-bar-fill" style="width: 78%;"></div></div>
                </div>
                <div class="status-item">
                    <label>LINK MEMORY</label>
                    <div class="status-bar-bg"><div class="status-bar-fill" style="width: 45%;"></div></div>
                </div>
            </div>
            
            <div class="system-status-panel" style="flex-grow: 1; font-size: 11px; line-height: 1.6;">
                <span style="color: var(--r2-blue); font-weight: bold;">[ SUBSYSTEMS ]</span><br>
